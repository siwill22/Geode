<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Geode Model Comparison</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0; height: 100%; overflow: hidden;
        background: #0b0d10;
        font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif;
        color: #d8dee4;
      }
      canvas { display: block; }
      /* lil-gui injects its own stylesheet at runtime, inserted before any
         <style> already in <head> (see its _injectStyles) specifically so
         a page's own overrides win the cascade -- these rules rely on
         that ordering rather than on !important. */
      .lil-gui .lil-controller.lil-number .lil-slider {
        --slider-knob-width: 8px;
      }
      .lil-gui .lil-controller.lil-number .lil-fill {
        background: #565d66;
        border-right: none;
        position: relative;
      }
      .lil-gui .lil-controller.lil-number .lil-fill::after {
        content: '';
        position: absolute;
        top: 0; right: calc(-1 * var(--slider-knob-width));
        width: var(--slider-knob-width); height: 100%;
        border-radius: 1.5px;
        background:
          linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.35)) center / 100% 2px no-repeat,
          linear-gradient(180deg, #a83232 0%, #8f2626 50%, #7a1f1f 100%);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.12),
          0 0 0 1px rgba(0, 0, 0, 0.5),
          0 1px 2px rgba(0, 0, 0, 0.5);
      }
      /* Single globe, fixed corners -- no multi-globe tiling in v1.5. */
      .status {
        position: fixed;
        padding: 6px 10px; border-radius: 4px;
        background: rgba(0, 0, 0, 0.6); color: #cfd6dd;
      }
      .timeinfo {
        position: fixed;
        padding: 6px 10px; border-radius: 4px;
        background: rgba(0, 0, 0, 0.6); color: #9fb4c8;
        font-variant-numeric: tabular-nums;
      }
      .legend {
        position: fixed;
        padding: 8px 10px; border-radius: 4px;
        background: rgba(0, 0, 0, 0.6);
      }
      .legend-label {
        color: #cfd6dd; margin-bottom: 4px;
      }
      .legend-ramp {
        display: block; width: 256px; height: 12px;
        border-radius: 2px;
      }
      .legend-ticks {
        display: none; justify-content: space-between; width: 256px;
        margin-top: 3px; color: #97a3ad; font-size: 11px;
        font-variant-numeric: tabular-nums;
      }
      .legend-key {
        display: none; margin-top: 6px; width: 256px;
        grid-template-columns: 1fr 1fr; column-gap: 10px; row-gap: 2px;
      }
      .legend-key-row {
        display: flex; align-items: center; gap: 5px;
        color: #cfd6dd; font-size: 11px; line-height: 1.3;
      }
      .legend-key-swatch {
        flex: none; width: 10px; height: 10px; border-radius: 2px;
      }
      .query-panel {
        position: fixed;
        padding: 6px 10px; border-radius: 4px;
        background: rgba(0, 0, 0, 0.6); color: #cfd6dd;
        font-variant-numeric: tabular-nums;
        cursor: default;
      }
      .credit {
        position: fixed;
        color: #5d6873; font-size: 11px; max-width: 40ch; text-align: right;
      }
      #error {
        position: fixed; left: 12px; top: 90px; max-width: 60ch;
        padding: 10px; border-radius: 4px; white-space: pre-wrap;
        background: #3a1416; color: #ffb4b4;
      }
    </style>
  </head>
  <body>
    <script type="module" src="/src/groupGlobe/main.ts"></script>
  </body>
</html>
