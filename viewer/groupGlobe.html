<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Geode Model Comparison</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0; height: 100%; overflow: hidden;
        background: #0b0d10;
        font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif;
        color: #d8dee4;
      }
      canvas { display: block; }
      /* lil-gui injects its own stylesheet at runtime, inserted before any
         <style> already in <head> (see its _injectStyles) specifically so
         a page's own overrides win the cascade -- these rules rely on
         that ordering rather than on !important. */
      .lil-gui .lil-controller.lil-number .lil-slider {
        --slider-knob-width: 8px;
      }
      .lil-gui .lil-controller.lil-number .lil-fill {
        background: #565d66;
        border-right: none;
        position: relative;
      }
      .lil-gui .lil-controller.lil-number .lil-fill::after {
        content: '';
        position: absolute;
        top: 0; right: calc(-1 * var(--slider-knob-width));
        width: var(--slider-knob-width); height: 100%;
        border-radius: 1.5px;
        background:
          linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.35)) center / 100% 2px no-repeat,
          linear-gradient(180deg, #a83232 0%, #8f2626 50%, #7a1f1f 100%);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.12),
          0 0 0 1px rgba(0, 0, 0, 0.5),
          0 1px 2px rgba(0, 0, 0, 0.5);
      }
      /* Multi-Globe toolbar (see docs/adr/0022) -- hidden by main.ts unless
         the recipe declared `multiGlobe`. Mirrors globe.html's identical
         #toolbar styling. */
      #toolbar {
        position: fixed; left: 50%; top: 8px; transform: translateX(-50%);
        display: flex; gap: 8px; z-index: 20;
      }
      #toolbar button {
        font: inherit; color: #d8dee4; background: #1b1f24;
        border: 1px solid #3a4048; border-radius: 4px;
        padding: 6px 12px; cursor: pointer;
      }
      #toolbar button:hover { background: #262b32; }
      .sync-toggle {
        display: flex; align-items: center; gap: 5px;
        font: inherit; color: #d8dee4; background: #1b1f24;
        border: 1px solid #3a4048; border-radius: 4px;
        padding: 6px 12px; cursor: pointer;
      }
      .status {
        position: fixed;
        padding: 6px 10px; border-radius: 4px;
        background: rgba(0, 0, 0, 0.6); color: #cfd6dd;
      }
      .timeinfo {
        position: fixed;
        padding: 6px 10px; border-radius: 4px;
        background: rgba(0, 0, 0, 0.6); color: #9fb4c8;
        font-variant-numeric: tabular-nums;
      }
      .legend {
        position: fixed;
        padding: 8px 10px; border-radius: 4px;
        background: rgba(0, 0, 0, 0.6);
      }
      .legend-label {
        color: #cfd6dd; margin-bottom: 4px;
      }
      .legend-ramp {
        display: block; width: 256px; height: 12px;
        border-radius: 2px;
      }
      .legend-ticks {
        display: none; justify-content: space-between; width: 256px;
        margin-top: 3px; color: #97a3ad; font-size: 11px;
        font-variant-numeric: tabular-nums;
      }
      .legend-key {
        display: none; margin-top: 6px; width: 256px;
        grid-template-columns: 1fr 1fr; column-gap: 10px; row-gap: 2px;
      }
      .legend-key-row {
        display: flex; align-items: center; gap: 5px;
        color: #cfd6dd; font-size: 11px; line-height: 1.3;
      }
      .legend-key-swatch {
        flex: none; width: 10px; height: 10px; border-radius: 2px;
      }
      .query-panel {
        position: fixed;
        padding: 6px 10px; border-radius: 4px;
        background: rgba(0, 0, 0, 0.6); color: #cfd6dd;
        font-variant-numeric: tabular-nums;
        cursor: default;
      }
      .credit {
        position: fixed;
        color: #5d6873; font-size: 11px; max-width: 40ch; text-align: right;
      }
      /* The `time-series` tool's fan-chart box -- see globe.html's identical
         block for the full reasoning (core/timeSeriesPanel.ts). */
      .timeseries-anchor {
        position: fixed;
        display: flex; flex-direction: column; align-items: flex-start;
        z-index: 10; overflow-y: auto; overflow-x: hidden;
      }
      .timeseries-toggle {
        white-space: nowrap;
        font: inherit; text-align: left; color: #97a3ad;
        background: #1b1f24; border: 1px solid #3a4048; border-radius: 4px;
        padding: 6px 12px; cursor: pointer;
      }
      .timeseries-toggle:hover { background: #262b32; }
      .timeseries-body {
        align-self: stretch;
        width: 100%; box-sizing: border-box;
        margin-top: 4px; padding: 8px;
        background: #1b1f24; border: 1px solid #3a4048; border-radius: 4px;
        display: none; flex-direction: column; gap: 8px;
      }
      .timeseries-row {
        display: flex; flex-direction: column; gap: 2px;
      }
      .timeseries-label {
        color: #97a3ad; font-size: 11px;
      }
      .timeseries-canvas {
        display: block; width: 100%; max-width: 260px; height: 110px;
        background: #12151a; border-radius: 2px; cursor: crosshair;
      }
      .timeseries-status {
        color: #6b7580; font-size: 11px; font-style: italic;
        min-height: 12px;
      }
      .timeseries-tooltip {
        position: fixed; display: none; z-index: 30;
        padding: 6px 8px; border-radius: 4px;
        background: rgba(10, 12, 15, 0.95); border: 1px solid #3a4048;
        color: #cfd6dd; font-size: 11px; line-height: 1.5;
        pointer-events: none; white-space: nowrap;
      }
      #error {
        position: fixed; left: 12px; top: 90px; max-width: 60ch;
        padding: 10px; border-radius: 4px; white-space: pre-wrap;
        background: #3a1416; color: #ffb4b4;
      }
    </style>
  </head>
  <body>
    <div id="toolbar" hidden>
      <button id="add-globe">+ Add globe</button>
      <label class="sync-toggle"><input type="checkbox" id="sync-age" /> sync time</label>
    </div>
    <script type="module" src="/src/groupGlobe/main.ts"></script>
  </body>
</html>
