<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Geode RiftsClimate Molchan test</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/core/lilgui-theme.css" />
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0; height: 100%; overflow: hidden;
        background: #0b0d10;
        font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif;
        color: #d8dee4;
      }
      canvas { display: block; }

      .status {
        position: fixed; left: 50%; top: 12px; transform: translateX(-50%);
        padding: 6px 10px; border-radius: 4px;
        background: rgba(0, 0, 0, 0.6); color: #cfd6dd;
      }

      /* Age at the bottom of the screen, apart from the settings panel
         (ADR-0058): reconstruction.html/climate.html's .bottom-bar,
         .age-slider-wrap and .age-readout, with the projection button beside
         the slider as in climate.html. [caption] [age group, centred] [ ]. */
      .bottom-bar {
        position: fixed; left: 12px; right: 12px; bottom: 8px;
        display: grid; grid-template-columns: 1fr auto 1fr;
        align-items: flex-end; column-gap: 16px;
        z-index: 10; pointer-events: none;
      }
      .bottom-bar > * { pointer-events: auto; }
      .age-group {
        grid-column: 2; justify-self: center;
        display: flex; align-items: flex-end; gap: 10px;
      }
      .age-slider-wrap {
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 4px;
        padding: 8px 10px; border-radius: 4px;
        background: rgba(0, 0, 0, 0.6);
      }
      .age-slider { width: 100%; }
      .age-readout {
        color: #9fb4c8; font-size: 11px; font-variant-numeric: tabular-nums;
      }
      /* The readout's number is editable, so an exact age can be typed. */
      .age-input {
        width: 4.5ch; padding: 0 2px; text-align: right;
        font: inherit; color: inherit; background: transparent;
        border: none; border-bottom: 1px dotted #4a5662;
      }
      .age-input:focus { outline: none; border-bottom-color: #9fb4c8; color: #e6ebf0; }
      .map-hint { color: #6d7883; font-size: 10.5px; }
      #projection-toggle {
        flex: none; align-self: center;
        width: 40px; height: 40px; padding: 0;
        display: flex; align-items: center; justify-content: center;
        font: inherit; color: #d8dee4; background: #1b1f24;
        border: 1px solid #3a4048; border-radius: 50%; cursor: pointer;
      }
      #projection-toggle:hover { background: #262b32; }
      #projection-toggle svg { display: block; width: 22px; height: 22px; }

      /* What is on screen and what could not be drawn: always visible, not
         behind a disclosure (the paleobio caption's rule). */
      .caption {
        grid-column: 1; justify-self: start; max-width: 54ch;
        color: #93a0ac; font-size: 11px; line-height: 1.5;
        background: rgba(10, 13, 17, 0.6); padding: 6px 9px; border-radius: 4px;
      }
      .caption-counts { margin-top: 3px; color: #7d8894; }

      .legend {
        position: fixed; left: 12px; top: 12px;
        width: 290px; max-height: calc(100vh - 230px); overflow-y: auto;
        display: flex; flex-direction: column; gap: 8px;
      }
      .legend-block {
        padding: 8px 10px; border-radius: 5px;
        background: rgba(10, 13, 17, 0.8); border: 1px solid #262c33;
      }
      .legend-title {
        color: #cfd6dd; font-size: 11px; letter-spacing: 0.02em; margin-bottom: 5px;
      }
      .legend-row { display: flex; align-items: center; gap: 7px; font-size: 12px; color: #c3ccd5; padding: 1px 0; }
      .legend-swatch { flex: none; width: 11px; height: 11px; border-radius: 2px; border: 1px solid rgba(255,255,255,0.25); }
      .legend-label { flex: 1 1 auto; }
      .legend-count { color: #8d99a5; font-variant-numeric: tabular-nums; font-size: 11px; }
      .legend-ramp { height: 10px; border-radius: 2px; margin-top: 2px; }
      .legend-ends { display: flex; justify-content: space-between; font-size: 10.5px; color: #97a3ad; margin-top: 2px; gap: 8px; }
      .legend-note { margin-top: 5px; color: #8d99a5; font-size: 10.5px; line-height: 1.45; }

      .gui-swatch { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }

      .popup {
        position: fixed; z-index: 2000; pointer-events: none;
        padding: 6px 9px; border-radius: 4px;
        background: rgba(10, 12, 15, 0.95); border: 1px solid #3a4048;
        color: #aeb8c2; font-size: 11px; line-height: 1.55; white-space: nowrap;
      }
      .popup-title { color: #e6ebf0; font-weight: 600; }

      .popup-dim { color: #7d8894; }
      /* A tighter legend than the deposit viewer's: it sits over the map's top-left corner. */
      .legend { width: 262px; gap: 5px; }
      .legend-block { padding: 6px 8px; }
      .legend-note { margin-top: 3px; }
      .legend-canvas { display: block; margin: 2px 0 0; }
      .lil-gui.root { z-index: 30; }

      /* The charts panel, docked at the right edge; the map fills the window left of it. */
      .charts-panel {
        position: fixed; right: 0; top: 0; bottom: 0; width: min(470px, 36vw); z-index: 20;
        display: flex; flex-direction: column; gap: 4px; box-sizing: border-box;
        padding: 10px 12px; overflow-y: auto; gap: 10px;
        background: #0f1216; border-left: 1px solid #262c33;
      }
      .chart-block { display: flex; flex-direction: column; flex: none; }
      .chart-block-molchan .chart-canvas { height: 300px; }
      .chart-title { color: #e0e6ec; font-size: 12px; font-weight: 600; margin-bottom: 4px; }
      .chart-canvas { width: 100%; display: block; cursor: crosshair; }
      .chart-key { flex: none; display: flex; flex-wrap: wrap; gap: 2px 12px; margin-top: 4px; font-size: 11px; color: #b9c3cc; }
      .chart-key-row { display: flex; align-items: center; gap: 5px; }
      .chart-swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }
      .chart-swatch-line { height: 3px; width: 14px; border-radius: 2px; }
      .chart-note { flex-basis: 100%; color: #7d8894; font-size: 10.5px; line-height: 1.45; }

      /* The Molchan diagram's skill line and the list of every factor's skill. */
      .molchan-skill { margin-top: 6px; color: #e0e6ec; font-size: 12px; font-variant-numeric: tabular-nums; }
      .molchan-skill-bad { color: #ffb4b4; }
      /* In a column block the WP10 notes' flex-basis: 100% would take the block's whole height. */
      .chart-block .chart-note { margin-top: 6px; flex-basis: auto; }
      .molchan-factors { display: flex; flex-direction: column; gap: 1px; }
      .molchan-factor {
        display: grid; grid-template-columns: 1fr 90px 46px; align-items: center; gap: 8px;
        padding: 3px 5px; border-radius: 3px; cursor: pointer; font-size: 11.5px; color: #b9c3cc;
      }
      .molchan-factor:hover { background: #1b1f24; }
      .molchan-factor-current { background: #20262d; color: #e6ebf0; }
      .molchan-factor-skill { text-align: right; font-variant-numeric: tabular-nums; }
      .molchan-bar-track { position: relative; height: 8px; background: rgba(200, 210, 220, 0.06); border-radius: 2px; }
      .molchan-bar-track::after {
        content: ''; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: rgba(200, 210, 220, 0.4);
      }
      .molchan-bar { position: absolute; top: 0; bottom: 0; background: #6ea0dc; border-radius: 2px; }
      .molchan-bar-neg { background: #c8615a; }

      #error {
        position: fixed; left: 12px; top: 90px; max-width: 70ch;
        padding: 10px; border-radius: 4px; white-space: pre-wrap;
        background: #3a1416; color: #ffb4b4; z-index: 50;
      }
    </style>
  </head>
  <body>
    <button id="projection-toggle" aria-label="Switch projection" title="Switch projection">&#9645;</button>
    <script type="module" src="/src/molchan/main.ts"></script>
  </body>
</html>
