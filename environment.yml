# Python environment for Geode's prep/ scripts.
#
#   conda env create -f environment.yml
#   conda activate geode
#
# The README's commands say `conda run -n pygmt17` because that is the environment they were
# developed in; `-n geode` works identically against this file.
#
# Almost everything here is pip-installable. The exception is GMT, which is a C library that
# pygmt wraps but does not bundle, and which is why this is a conda environment rather than a
# requirements.txt. GMT is needed by prep_model.py and prep_coastlines.py; the rest of the
# pipeline, and all of gprm's data fetching and analysis, runs without it.

name: geode

channels:
  - conda-forge

dependencies:
  - python=3.12

  # Needs a system library, so it comes from conda rather than pip
  - gmt>=6

  # Everything below is available on PyPI too, but conda-forge resolves the geospatial
  # stack's binary dependencies (GEOS, PROJ, GDAL, netCDF) more reliably.
  - numpy
  - scipy
  - pandas
  - geopandas
  - shapely
  - rasterio
  - xarray
  - netcdf4
  - matplotlib
  - cartopy
  - pillow
  - pooch
  - requests
  - tqdm
  - pyyaml
  - openpyxl          # dataset loaders read .xlsx compilations
  - scikit-image
  - astropy-healpix   # equal-area point distributions; gprm falls back without it

  - pip
  - pip:
      # pygplates and PlateTectonicTools publish manylinux/macOS/Windows wheels
      - pygplates
      - PlateTectonicTools
      - pygmt

      # gprm provides the reconstruction models, the published palaeo-datasets and the
      # proximity engine. Pin to a release or commit for a reproducible build.
      - gprm @ git+https://github.com/siwill22/GPlatesReconstructionModel
