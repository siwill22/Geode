# Python environment for Geode's prep/ scripts -- the conda route.
#
#   conda env create -f environment.yml
#   conda activate geode
#
# The portable baseline is requirements.txt (pip + one system GMT package), which works where
# conda does not: CI runners, agent sandboxes such as a Claude Cowork VM, locked-down machines.
# This file builds the same stack with conda, for anyone who prefers it; keep the two in step.
# Nothing in the repo assumes either one -- scripts run whichever `python` is active.
#
# GMT is the one dependency pip cannot provide (pygmt wraps the C library but does not bundle
# it); here conda supplies it. GMT is needed by prep_model.py and prep_coastlines.py; the rest
# of the pipeline, and all of gprm's data fetching and analysis, runs without it.

name: geode

channels:
  - conda-forge

dependencies:
  - python=3.12

  # Needs a system library, so it comes from conda rather than pip
  - gmt>=6

  # Everything below is available on PyPI too, but conda-forge resolves the geospatial
  # stack's binary dependencies (GEOS, PROJ, GDAL, netCDF) more reliably.
  - numpy
  - scipy
  - pandas
  - geopandas
  - shapely
  - rasterio
  - xarray
  - netcdf4
  - matplotlib
  - cartopy
  - pillow
  - pooch
  - requests
  - tqdm
  - pyyaml
  - openpyxl          # dataset loaders read .xlsx compilations
  - scikit-image
  - astropy-healpix   # equal-area point distributions; gprm falls back without it

  - pip
  - pip:
      # pygplates and PlateTectonicTools publish manylinux/macOS/Windows wheels
      - pygplates
      - PlateTectonicTools
      - pygmt

      # gprm provides the reconstruction models, the published palaeo-datasets and the
      # proximity engine. Pin to a release or commit for a reproducible build.
      - gprm @ git+https://github.com/siwill22/GPlatesReconstructionModel
